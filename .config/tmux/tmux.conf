# Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Set tmux to use 24-bit colour
set -sa terminal-overrides ",xterm*:Tc"

# Remap tmux leader to Ctrl-a (easy with caps lock remapped to ctrl)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and - instead of " and %, respectively
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Just in case…
set -g mouse on

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Disable status bar entirely
set -g status off

# Windows
set -g renumber-windows on
set -g base-index 1

# Initialise tpack (this line must stay at the very bottom of this file)
run 'tpack init'
